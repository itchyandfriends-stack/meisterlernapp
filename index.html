<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meister-Lern-App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b23" media="(prefers-color-scheme: dark)">
<script>
// Hell/Dunkel sofort setzen, bevor etwas gezeichnet wird (sonst blitzt die falsche Farbe kurz auf).
// Browserleiste: bei „Automatisch“ wählt der Browser selbst die passende der beiden Farben, sonst beide gleich.
function applyTheme(t) {
  const r = document.documentElement, fixed = t === "light" || t === "dark";
  if (fixed) r.dataset.theme = t; else delete r.dataset.theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    const dark = fixed ? t === "dark" : /dark/.test(m.media);
    m.content = dark ? "#141b23" : "#f3f4f1";
  });
}
try { applyTheme((JSON.parse(localStorage.getItem("meister-lern-app-v1")) || {}).theme); } catch (e) { applyTheme(); }
</script>
<meta name="robots" content="noindex, nofollow"><!-- Testphase: nicht in Suchmaschinen, bis ein Dozent die Inhalte geprüft hat -->
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: eine Spalte wie ein Werkstattheft, unten feste Reiter, Zollstock-Gelb als einziges Signal */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #1d2a38;
  --muted: #5b6672;
  --line: #d9dcd6;        /* nur Trennlinien */
  --field-border: #8a9088; /* Rahmen von Feldern und Knöpfen, mind. 3:1 Kontrast, auch draußen erkennbar */
  --accent: #e8b007;      /* Zollstock-Gelb */
  --accent-ink: #1d2a38;
  --good: #2f7d4f;
  --good-bg: #e3f1e8;
  --bad: #b23a2b;
  --bad-bg: #f8e4e0;
  --warn-bg: #fdf3d2;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141b23; --surface: #1c2631; --ink: #e9ecef; --muted: #9aa6b2; --line: #2e3a47; --field-border: #6b7888;
  --accent: #f2c230; --accent-ink: #141b23; --good: #6cc792; --good-bg: #1d3528;
  --bad: #ef8a7a; --bad-bg: #3d2421; --warn-bg: #3a3218; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141b23; --surface: #1c2631; --ink: #e9ecef; --muted: #9aa6b2; --line: #2e3a47; --field-border: #6b7888;
  --accent: #f2c230; --accent-ink: #141b23; --good: #6cc792; --good-bg: #1d3528;
  --bad: #ef8a7a; --bad-bg: #3d2421; --warn-bg: #3a3218; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: .01em; line-height: 1; }
.brand span { background: var(--accent); color: var(--accent-ink); padding: 0 6px; margin-left: 4px; border-radius: 3px; }
.tag { font-size: 14px; color: var(--muted); }
.note { background: var(--warn-bg); border-radius: var(--r); padding: 10px 12px; font-size: 14px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
label { font-weight: 600; font-size: 14px; }
input[type="date"], input[type="text"], textarea, select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--field-border); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; min-height: 48px;
}
textarea { min-height: 110px; resize: vertical; }
button { font: inherit; cursor: pointer; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 12px 18px; min-height: 48px; font-weight: 600; }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--field-border); }
.btn.big { width: 100%; font-size: 19px; min-height: 56px; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { background: transparent; border: 1px solid var(--field-border); color: var(--ink); border-radius: 999px; padding: 10px 16px; min-height: 44px; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Countdown */
.count { display: flex; align-items: baseline; gap: 10px; }
.count b { font-family: var(--font-display); font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.plan li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.plan li:first-child { border-top: 0; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--field-border); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.tick.done { background: var(--good); border-color: var(--good); color: var(--surface); }
.plan .go { background: none; border: 1px solid var(--field-border); border-radius: 8px; color: var(--ink); font-weight: 600; padding: 8px 14px; min-height: 44px; }
.streak { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.streak b { font-family: var(--font-display); font-size: 28px; line-height: 1; }
.done-msg { background: var(--good-bg); border-left: 4px solid var(--good); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
.more summary { cursor: pointer; font-weight: 600; padding: 10px 0; min-height: 44px; }
.toolbox { display: flex; flex-direction: column; gap: 8px; }
.toolbox .row .btn { flex: 1 1 140px; }

/* Schwächenradar: Zollstock-Skala */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar-head .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 12px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.low { background: var(--bad); }
.bar i.ok { background: var(--good); }

/* Fragen */
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.pill { border: 1px solid var(--field-border); border-radius: 8px; padding: 1px 8px; }
.pill.draft { border-color: var(--accent); }
.qtext { font-size: 20px; font-weight: 600; line-height: 1.35; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--bg); color: var(--ink); border: 1px solid var(--field-border); border-radius: 8px; padding: 14px; min-height: 56px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.opt b { font-family: var(--font-mono); }
.opt.right { background: var(--good-bg); border: 2px solid var(--good); }
.opt.wrong { background: var(--bad-bg); border: 2px solid var(--bad); }
.opt em { grid-column: 2; font-style: normal; font-size: 14px; font-weight: 700; }
.opt.right em { color: var(--good); } .opt.wrong em { color: var(--bad); }
.opt:disabled { cursor: default; color: var(--ink); }
.explain { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 4px; }
.law { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.term { font-size: 15px; color: var(--muted); }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }

/* Rechnen */
.calc-given { font-family: var(--font-mono); font-size: 14px; background: var(--bg); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; }
.calc-given span:nth-child(even) { text-align: right; }
.steps { font-family: var(--font-mono); font-size: 14px; line-height: 1.7; background: var(--bg); border-radius: 8px; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
.answer { display: flex; gap: 8px; }
.answer input { flex: 1; }
.unit { align-self: center; font-family: var(--font-mono); color: var(--muted); }

/* Fälle */
.case-text { font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: 14px; width: 100%; font-variant-numeric: tabular-nums; }
.tbl td { border-bottom: 1px solid var(--line); padding: 6px 4px; }
.tbl td:last-child { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
.task { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.task-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.task-h .pts { font-family: var(--font-mono); font-weight: 400; color: var(--muted); white-space: nowrap; }
.solution { background: var(--bg); border-radius: 8px; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.selfscore { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.selfscore input { width: 80px; }
.total { font-family: var(--font-display); font-size: 22px; }

/* Reiter unten */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { background: none; border: 0; color: var(--muted); padding: 10px 4px 12px; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .02em; border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.help summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.help summary::-webkit-details-marker { display: none; }
.help summary::after { content: "+"; font-family: var(--font-display); font-size: 24px; color: var(--muted); }
.help[open] summary::after { content: "−"; }
.howto { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.status { font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.bar-head b { min-width: 0; hyphens: auto; overflow-wrap: anywhere; }
.status.low { color: var(--bad); } .status.ok { color: var(--good); }
.legend { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); display: inline-block; }
.dot.low { background: var(--bad); } .dot.ok { background: var(--good); }
.tip { background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; }
.mini { font-family: var(--font-mono); font-size: 13px; }
.numrow { display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 8px; border: 1px solid transparent; }
.numrow.right { background: var(--good-bg); border-color: var(--good); }
.numrow.wrong { background: var(--bad-bg); border-color: var(--bad); }
.ok-t { color: var(--good); } .no-t { color: var(--bad); }
.checks { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 12px; margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.checks legend { font-weight: 600; font-size: 14px; padding: 0 4px; }
.check { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: start; font-weight: 400; font-size: 15px; padding: 6px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--good); }
.check .p { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.result { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 8px; background: var(--bg); border-left: 4px solid var(--accent); }
.result.full { background: var(--good-bg); border-left-color: var(--good); }
.check.auto span:first-of-type { font-weight: 600; }
.found { font-style: normal; font-size: 13px; font-weight: 600; color: var(--good); border: 1px solid var(--good); border-radius: 999px; padding: 0 6px; margin-left: 4px; white-space: nowrap; }
.sign { flex: 0 0 auto; min-width: 48px; border: 1px solid var(--field-border); background: var(--surface); color: var(--ink); border-radius: 8px; font-family: var(--font-mono); font-size: 18px; }
details.solution summary { cursor: pointer; }
.sum { display: flex; flex-direction: column; gap: 4px; border-top: 2px solid var(--ink); padding-top: 12px; }
.card h3 { margin-top: 4px; }
.confirm { background: var(--warn-bg); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease; } }

/* Prüfungssimulation */
.stack { display: flex; flex-direction: column; gap: 16px; }
.simbar { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 10px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.clock { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock.warn { color: var(--bad); }
.opt.picked { border: 2px solid var(--ink); background: var(--surface); }
.opt.picked em { color: var(--ink); }
.choice { display: flex; flex-direction: column; gap: 10px; }
.choice .btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 14px 18px; min-height: 64px; }
.choice .btn span { font-weight: 400; font-size: 15px; }
.verdict-box { border-radius: 8px; padding: 12px; border-left: 4px solid var(--good); background: var(--good-bg); display: flex; flex-direction: column; gap: 4px; }
.verdict-box.no { border-left-color: var(--bad); background: var(--bad-bg); }
.verdict-box b { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.wrong-item { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.wrong-item .qtext { font-size: 17px; }

/* Rechenweg als Kalkulationsschema */
.scheme { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; background: var(--bg); border-radius: 8px; }
.scheme td { padding: 5px 6px; vertical-align: bottom; }
.scheme td:nth-child(2) { hyphens: auto; overflow-wrap: anywhere; }
.scheme .op { width: 22px; font-family: var(--font-mono); font-weight: 700; text-align: center; padding-right: 0; }
.scheme .val { text-align: right; white-space: nowrap; font-family: var(--font-mono); font-size: 14px; }
.scheme tr.s-sum td:not(.op) { border-top: 1px solid var(--ink); font-weight: 600; }
.scheme tr.s-ans td:not(.op) { font-weight: 700; }
.scheme tr.s-ans .val span { border-bottom: 3px double var(--ink); padding-bottom: 1px; }
.side { font-size: 14px; display: flex; flex-direction: column; gap: 4px; border-left: 3px solid var(--line); padding-left: 10px; }
.side div { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }

/* Heute: Fortschritt beim Tagesziel */
.goal { display: flex; flex-direction: column; gap: 4px; }

/* Bist du bereit? */
.ready { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.ready:first-of-type { border-top: 0; }
.ready .go { background: none; border: 1px solid var(--field-border); border-radius: 8px; color: var(--ink); font-weight: 600; padding: 8px 14px; min-height: 44px; }
.light { width: 18px; height: 18px; border-radius: 50%; background: var(--line); border: 2px solid var(--field-border); }
.light.low { background: var(--bad); border-color: var(--bad); }
.light.mid { background: var(--accent); border-color: var(--accent); }
.light.ok { background: var(--good); border-color: var(--good); }

/* Fachgespräch: Spickzettel */
.cheat { border: 2px solid var(--ink); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
@media print {
  nav.tabs, header.top, .note, #v-faelle .seg, #v-faelle .card > h2, #v-faelle .card > p, #v-faelle .row, #save-warn { display: none !important; }
  .card { border: 0; padding: 0; }
  :root { --bg: #fff !important; --surface: #fff !important; --ink: #000 !important; --muted: #333 !important; }
}

/* Merken, Vorlesen */
.qtools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { background: transparent; border: 1px solid var(--field-border); color: var(--ink); border-radius: 8px; padding: 8px 12px; min-height: 44px; font-weight: 600; font-size: 15px; }
.tool[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--accent); }

/* Fachwörter: antippen zeigt die Klartext-Erklärung */
.gl { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: inherit; cursor: pointer;
  text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--accent); }
.gl[aria-expanded="true"] { background: var(--warn-bg); border-radius: 3px; }
.gl-box { background: var(--warn-bg); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 15px; font-weight: 400; line-height: 1.45;
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
.gl-box button { background: none; border: 0; color: var(--ink); font-size: 22px; line-height: 1; min-width: 44px; min-height: 44px; margin: -10px -8px -10px 0; }
.gl-list { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 0; }
.gl-list dt { font-weight: 700; }
.gl-list dd { margin: 0; font-size: 15px; color: var(--muted); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 class="brand" style="margin:0">Meister<span>III + IV</span></h1>
    <div class="tag">Prototyp · Rechtsstand 17.10.2026</div>
  </header>
  <p class="note">Alle Fragen und Lösungen sind Entwürfe und noch nicht von einem Dozenten geprüft.</p>

  <section id="v-heute" class="view"></section>
  <section id="v-fragen" class="view" hidden></section>
  <section id="v-rechnen" class="view" hidden></section>
  <section id="v-faelle" class="view" hidden></section>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="in">
  <button data-v="heute" aria-current="page">Heute</button>
  <button data-v="fragen">Fragen</button>
  <button data-v="rechnen">Rechnen</button>
  <button data-v="faelle">Fälle</button>
</div></nav>

<script src="fragen.js"></script>
<script>
if (typeof Q === "undefined") {
  document.querySelector(".wrap").innerHTML = '<div class="card"><h2>Fragen fehlen</h2><p>Die Datei <b>fragen.js</b> wurde nicht gefunden. Sie muss im selben Ordner liegen wie diese Seite.</p></div>';
  throw new Error("fragen.js fehlt");
}
/* ---------- Inhalte (Entwurf aus „Probetest Meisterprüfung Teil III und IV“) ---------- */
const HF = {
  "III-1": "Wettbewerbsfähigkeit beurteilen",
  "III-2": "Betrieb gründen oder übernehmen",
  "III-3": "Betrieb führen",
  "IV-1": "Ausbildung planen",
  "IV-2": "Ausbildung vorbereiten und Azubis einstellen",
  "IV-3": "Ausbildung durchführen",
  "IV-4": "Ausbildung abschließen",
  "IV-P": "Präsentation und Fachgespräch"
};
/* Die Fragen stehen in fragen.js (Variable Q). */

/* Fallaufgaben (Entwurf). Jeder Fall wird mit make(P) gebaut: P(optionen, standard) liefert beim ersten Mal den
   Standardwert und nach „Fall neu starten“ einen zufälligen Wert. nums = Ergebnisse, die die App prüft;
   groups = Antworten zum Abhaken (max = höchstens so viele Punkte). */
const CASE_DEFS = [
 {id:"F3", teil:"Teil III", short:"Tischlerei", varies:true, make(P) {
  const K = P(range(80000, 200000, 10000), 90000);
  const EK = P(range(20000, 60000, 5000).filter(x => x <= K - 40000), 30000), D = K - EK;
  const z = P([4, 5, 6, 7], 6), n = P([5, 8, 10], 10);
  const miete = P(range(12000, 24000, 1200), 18000), vers = P(range(3600, 6000, 600), 4800), fz = P(range(4800, 9600, 1200), 7200);
  const sonst = P(range(4000, 8000, 400), 6400), ul = P(range(30000, 48000, 2000), 36000), lohn = P(range(64000, 84000, 2000), 76000);
  const hg = P(range(2600, 3000, 100), 2800), hm = P(range(800, 1200, 100), 1000), g = P([5, 8, 10], 5);
  const zi = D * z / 100, t = D / n, kd = t + zi, m = r2(kd / 12);
  const fix = miete + vers + fz + zi + sonst, G = fix + ul + lohn, h = hg + hm;
  const sk = r2(G / h), gz = r2(sk * g / 100), net = r2(sk + gz), ust = r2(net * .19), br = r2(net + ust);
  const AB = P(range(3000, 8000, 500), 5000), A = P(range(11000, 15000, 500), 12500);
  const M1 = P(range(500, 3000, 500), 1500), M2 = P(range(-3000, -500, 500), -1000), E1 = M1 + A - AB, E2 = M2 - M1 + A;
  const e0 = x => eur(x, 0);
  return {title:"Gründung, Übernahme und Kalkulation",
   intro:[`Tischlermeister Max Berger übernimmt zum 1. Januar eine bestehende Tischlerei mit zwei Gesellen. Der Kaufpreis beträgt ${e0(K)}. Er bringt ${e0(EK)} Eigenkapital ein und nimmt ein Darlehen über ${e0(D)} auf. Der Zinssatz beträgt ${z} % pro Jahr, die Tilgung erfolgt linear über ${n} Jahre, die Zinsen werden auf die Anfangsschuld des Jahres berechnet. Berger möchte seine persönliche Haftung begrenzen.`,
     `Produktive Stunden pro Jahr: insgesamt ${num(h)} (Gesellen zusammen ${num(hg)}, Berger ${num(hm)}). Gewinnzuschlag ${g} %, Umsatzsteuer 19 %.`],
   table:[["Miete Werkstatt", e0(miete)], ["Versicherungen", e0(vers)], ["Fahrzeugkosten", e0(fz)], ["Zinsen auf das Darlehen", "aus Aufgabe 1"], ["Sonstige Fixkosten", e0(sonst)], ["Kalkulatorischer Unternehmerlohn", e0(ul)], ["Löhne der zwei Gesellen inkl. Lohnnebenkosten", e0(lohn)]],
   tasks:[
    {t:"Berechne die Zinsen für das erste Jahr.", p:6, nums:[{l:"Zinsen im 1. Jahr", a:zi, u:"€", p:6}],
     scheme:[["", `Zinsen im 1. Jahr (${z} %)`, eur(zi), 1]],
     side:[`Zinsen: ${eur(D)} × ${z} : 100 = ${eur(zi)}`]},
    {t:"Berechne die jährliche Tilgung, den Kapitaldienst im ersten Jahr und den monatlichen Kapitaldienst.", p:10,
     nums:[{l:"Tilgung pro Jahr", a:t, u:"€", p:3}, {l:"Kapitaldienst im 1. Jahr", a:kd, u:"€", p:4}, {l:"Kapitaldienst pro Monat", a:m, u:"€", p:3}],
     scheme:[["", "Tilgung pro Jahr", eur(t), 1], ["+", "Zinsen im 1. Jahr", eur(zi)], ["=", "Kapitaldienst im 1. Jahr", eur(kd), 1], [":", "12 Monate", ""], ["=", "Kapitaldienst pro Monat", eur(m), 1]],
     side:[`Tilgung: ${eur(D)} : ${n} Jahre = ${eur(t)}`, `Pro Monat: ${eur(kd)} : 12 = ${eur(m)}`]},
    {t:"Berechne die Gesamtkosten, die Selbstkosten je produktiver Stunde, den Netto-Stundenverrechnungssatz mit Gewinnzuschlag und den Brutto-Stundensatz. Runde auf Cent.", p:14,
     nums:[{l:"Gesamtkosten pro Jahr", a:G, u:"€", p:4}, {l:"Selbstkosten je Stunde", a:sk, u:"€", p:4}, {l:"Netto-Stundensatz", a:net, u:"€", p:3}, {l:"Brutto-Stundensatz", a:br, u:"€", p:3}],
     scheme:[["", "Miete Werkstatt", eur(miete)], ["+", "Versicherungen", eur(vers)], ["+", "Fahrzeugkosten", eur(fz)], ["+", "Zinsen", eur(zi)], ["+", "Sonstige Fixkosten", eur(sonst)], ["=", "Fixkosten", eur(fix)],
       ["+", "Kalkulatorischer Unternehmerlohn", eur(ul)], ["+", "Löhne der Gesellen", eur(lohn)], ["=", "Gesamtkosten pro Jahr", eur(G), 1],
       ["", "Selbstkosten je Stunde", eur(sk), 1], ["+", `Gewinnzuschlag ${g} %`, eur(gz)], ["=", "Verrechnungssatz netto", eur(net), 1], ["+", "Umsatzsteuer 19 %", eur(ust)], ["=", "Verrechnungssatz brutto", eur(br), 1]],
     side:[`Selbstkosten je Stunde: ${eur(G)} : ${num(h)} Std. = ${eur(sk)}`, `Gewinnzuschlag: ${eur(sk)} × ${g} : 100 = ${eur(gz)}`, `Umsatzsteuer: ${eur(net)} × 19 : 100 = ${eur(ust)}`]},
    {t:`Liquiditätsplan: Anfangsbestand Monat 1: ${e0(AB)}; Einzahlungen Monat 1: ${e0(E1)}, Auszahlungen ${e0(A)}; Einzahlungen Monat 2: ${e0(E2)}, Auszahlungen ${e0(A)}. Berechne die Endbestände, beurteile die Lage und nenne zwei Maßnahmen.`, p:10,
     nums:[{l:"Endbestand Monat 1", a:M1, u:"€", p:2}, {l:"Endbestand Monat 2", a:M2, u:"€", p:2}],
     scheme:[["", "Anfangsbestand Monat 1", eur(AB)], ["+", "Einzahlungen Monat 1", eur(E1)], ["−", "Auszahlungen Monat 1", eur(A)], ["=", "Endbestand Monat 1", eur(M1), 1],
       ["+", "Einzahlungen Monat 2", eur(E2)], ["−", "Auszahlungen Monat 2", eur(A)], ["=", "Endbestand Monat 2", eur(M2), 1]],
     side:["Der Endbestand von Monat 1 ist der Anfangsbestand von Monat 2.", `Ein Minus heißt: Es fehlen ${eur(-M2)}.`],
     groups:[{g:"Beurteilung", max:2, items:[[`Im 2. Monat fehlen ${e0(-M2)}. Ohne Gegenmaßnahme kann der Betrieb nicht alle Rechnungen zahlen.`, 2]]},
             {g:"Zwei Maßnahmen (je 2 Punkte)", max:4, items:[["Kontokorrentkredit (Dispo) mit der Bank vereinbaren", 2], ["Abschlagszahlungen mit Kunden vereinbaren", 2], ["Längere Zahlungsziele bei Lieferanten aushandeln", 2], ["Offene Rechnungen konsequent mahnen", 2], ["Anschaffungen verschieben", 2]]}]},
    {t:"Nenne fünf Schritte oder Anmeldungen, die Berger für die selbstständige Ausübung seines Handwerks erledigen muss.", p:10,
     groups:[{g:"Fünf Schritte (je 2 Punkte)", max:10, items:[["Eintragung in die Handwerksrolle bei der Handwerkskammer", 2], ["Gewerbeanmeldung beim Gewerbeamt", 2], ["Anmeldung bei der Berufsgenossenschaft", 2], ["Anmeldung beim Finanzamt", 2], ["Eintragung ins Handelsregister (wenn kaufmännischer Betrieb)", 2], ["Anmeldung der Mitarbeiter bei der Sozialversicherung", 2], ["Betriebshaftpflichtversicherung abschließen", 2]]}]},
    {t:"Berger möchte seine persönliche Haftung beschränken. Nenne zwei Rechtsformen mit gesetzlichem Mindestkapital und drei Nachteile.", p:10,
     groups:[{g:"Rechtsformen und Kapital", max:7, items:[["GmbH genannt", 2], ["GmbH: mindestens 25.000 € Stammkapital", 2], ["UG (haftungsbeschränkt) genannt", 2], ["UG: Stammkapital ab 1 €", 1]]},
             {g:"Drei Nachteile (je 1 Punkt)", max:3, items:[["Mehr Aufwand bei Gründung und Verwaltung", 1], ["Pflicht zur Bilanz und Veröffentlichung des Jahresabschlusses", 1], ["Strenge Regeln zum Kapital", 1], ["UG muss Rücklagen bilden", 1], ["Banken verlangen oft trotzdem eine persönliche Bürgschaft", 1]]}]}
   ]};
 }},
 {id:"F5", teil:"Teil III", short:"Elektro", varies:true, make(P) {
  const F = P(range(40000, 72000, 2000), 54000), p = P([55, 58, 60, 62, 65], 60), kv = P([10, 12, 15, 18], 15), db = p - kv, be = Math.ceil(F / db);
  const EK = P(range(10000, 40000, 5000), 20000), FK = P(range(30000, 90000, 10000), 60000), BS = EK + FK, q = Math.round(EK / BS * 1000) / 10;
  const M = P(range(1200, 3600, 200), 2000), mz = P([10, 15, 20], 10), hrs = P(range(10, 24, 2), 16), rate = p;   // derselbe Stundensatz wie in der Einleitung
  const mat = r2(M * (1 + mz / 100)), lk = hrs * rate, net = r2(mat + lk), ust = r2(net * .19), br = r2(net + ust);
  const e0 = x => eur(x, 0);
  return {title:"Gründung eines Elektrobetriebs",
   intro:[`Elektrotechnikermeisterin Lena Hofmann macht sich als Einzelunternehmerin selbstständig. Sie arbeitet zunächst allein und bietet Elektroinstallationen für Privathaushalte an.`,
     `Ihre Fixkosten einschließlich kalkulatorischem Unternehmerlohn betragen ${e0(F)} im Jahr. Sie rechnet mit einem Stundensatz von ${e0(p)} netto. Pro Arbeitsstunde fallen ${e0(kv)} variable Kosten an (Kleinmaterial, Fahrzeug).`,
     `Nach der Gründung hat sie ${e0(EK)} Eigenkapital und ${e0(FK)} Fremdkapital (Bankkredit).`],
   table:null,
   tasks:[
    {t:"Wie viele Stunden muss Frau Hofmann im Jahr abrechnen, damit alle Kosten gedeckt sind? Berechne zuerst den Deckungsbeitrag pro Stunde. Runde auf volle Stunden auf.", p:10,
     nums:[{l:"Deckungsbeitrag pro Stunde", a:db, u:"€", p:4}, {l:"Stunden pro Jahr (Gewinnschwelle)", a:be, u:"Std.", p:6, tol:.5}],
     scheme:[["", "Stundensatz netto", eur(p)], ["−", "Variable Kosten je Stunde", eur(kv)], ["=", "Deckungsbeitrag je Stunde", eur(db), 1], ["", "Gewinnschwelle", num(be) + " Std.", 1]],
     side:["Gewinnschwelle = Fixkosten : Deckungsbeitrag je Stunde", `${eur(F, 0)} : ${eur(db, 0)} = ${num(F / db, 1)} Std., aufgerundet ${num(be)} Std.`]},
    {t:"Berechne die Bilanzsumme und die Eigenkapitalquote. Runde auf eine Stelle nach dem Komma.", p:6,
     nums:[{l:"Bilanzsumme", a:BS, u:"€", p:2}, {l:"Eigenkapitalquote", a:q, u:"%", p:4, tol:.051}],
     scheme:[["", "Eigenkapital", eur(EK)], ["+", "Fremdkapital", eur(FK)], ["=", "Bilanzsumme", eur(BS), 1], ["", "Eigenkapitalquote", num(q, 1) + " %", 1]],
     side:["Eigenkapitalquote = Eigenkapital × 100 : Bilanzsumme", `${eur(EK, 0)} × 100 : ${eur(BS, 0)} = ${num(q, 1)} %`]},
    {t:`Ein Kunde möchte ein Angebot für eine neue Elektroverteilung. Material kostet im Einkauf ${e0(M)}, darauf kommen ${mz} % Materialzuschlag. Frau Hofmann rechnet mit ${hrs} Arbeitsstunden zu ${e0(rate)}. Berechne den Nettopreis und den Bruttopreis (19 % Umsatzsteuer).`, p:14,
     nums:[{l:"Material mit Zuschlag", a:mat, u:"€", p:3}, {l:"Arbeitskosten (Stunden × Stundensatz)", a:lk, u:"€", p:3}, {l:"Angebotspreis netto", a:net, u:"€", p:4}, {l:"Angebotspreis brutto", a:br, u:"€", p:4}],
     scheme:[["", "Material (Einkauf)", eur(M)], ["+", `Materialzuschlag ${mz} %`, eur(r2(mat - M))], ["=", "Material mit Zuschlag", eur(mat), 1], ["+", "Arbeitskosten", eur(lk), 1], ["=", "Angebotspreis netto", eur(net), 1], ["+", "Umsatzsteuer 19 %", eur(ust)], ["=", "Angebotspreis brutto", eur(br), 1]],
     side:[`Materialzuschlag: ${eur(M)} × ${mz} : 100 = ${eur(r2(mat - M))}`, `Arbeitskosten: ${hrs} Std. × ${eur(rate)} = ${eur(lk)}`, `Umsatzsteuer: ${eur(net)} × 19 : 100 = ${eur(ust)}`]},
    {t:"Nenne drei Vorteile und zwei Nachteile der Rechtsform Einzelunternehmen.", p:10,
     groups:[{g:"Drei Vorteile (je 2 Punkte)", max:6, items:[["Sie entscheidet allein und schnell", 2], ["Einfache und günstige Gründung", 2], ["Kein Mindestkapital nötig", 2], ["Der Gewinn gehört ihr allein", 2]]},
             {g:"Zwei Nachteile (je 2 Punkte)", max:4, items:[["Sie haftet unbeschränkt, auch mit ihrem Privatvermögen", 2], ["Kredite und Kapital sind schwerer zu bekommen", 2], ["Sie trägt das Risiko allein, z. B. bei Krankheit", 2]]}]},
    {t:"Nenne fünf Versicherungen, die Frau Hofmann abschließen muss oder sollte.", p:10,
     groups:[{g:"Fünf Versicherungen (je 2 Punkte)", max:10, items:[["Betriebshaftpflichtversicherung", 2], ["Gesetzliche Unfallversicherung bei der Berufsgenossenschaft", 2], ["Krankenversicherung", 2], ["Rentenversicherung (Pflicht für Handwerker in der Handwerksrolle)", 2], ["Inhalts- oder Werkzeugversicherung (Diebstahl, Feuer)", 2], ["Betriebsunterbrechungsversicherung", 2], ["Rechtsschutzversicherung", 2]]}]},
    {t:"Nenne fünf Maßnahmen, mit denen Frau Hofmann Kunden gewinnen kann.", p:10,
     groups:[{g:"Fünf Maßnahmen (je 2 Punkte)", max:10, items:[["Google-Unternehmensprofil anlegen", 2], ["Eigene Webseite", 2], ["Firmenfahrzeug beschriften", 2], ["Empfehlungen und Bewertungen zufriedener Kunden", 2], ["Social Media, z. B. Instagram oder Facebook", 2], ["Zusammenarbeit mit anderen Handwerkern oder Bauträgern", 2], ["Anzeigen, Flyer oder Lokalzeitung", 2]]}]}
   ]};
 }},
 {id:"F4", teil:"Teil IV", short:"Malerbetrieb", make() { return {title:"Ausbildung im eigenen Betrieb",

 {id:"F6", teil:"Teil IV", short:"Kfz-Werkstatt", make() { return {title:"Probleme mit einem Auszubildenden",

/* ---------- „Bist du bereit?“: Ampel je Prüfungsteil ----------
   Fasst zusammen, was schon da ist: wie viele Fragen gesehen, Trefferquote je Handlungsfeld, letzte Simulation.
   Grenzen (Entwurf): grün ab 80 % richtig, 80 % der Fragen gesehen und letzte Simulation bestanden; rot bei einem Feld unter 60 %. */
function readiness(teil) {
  const hfs = SIM_HF[teil], st = hfStats().filter(s => hfs.includes(s.k));
  const qs = Q.filter(q => hfs.includes(q.hf)), seenQ = qs.filter(q => S.stats[q.id]).length, cover = seenQ / qs.length;
  const seen = st.reduce((n, s) => n + s.seen, 0), right = st.reduce((n, s) => n + s.right, 0), rate = seen ? right / seen : 0, pct = Math.round(rate * 100);
  const weak = st.filter(s => s.rate != null && s.rate < .6);
  const sims = (S.simHistory || []).filter(h => h.teil === teil), last = sims[sims.length - 1];
  const why = [];
  if (cover < .3) return {cls: "", word: "Noch zu früh", why: `Du hast erst ${seenQ} von ${qs.length} Fragen gesehen. Übe weiter, dann kann die App mehr sagen.`, go: "fragen"};
  if (weak.length) why.push(`Schwach: ${weak.map(s => s.name).join(", ")}`);
  if (last && !last.passed) why.push(`Letzte Simulation: ${last.pct} %, nicht bestanden`);
  if (why.length || rate < .5) return {cls: "low", word: "Noch nicht bereit", why: (why.length ? why : [`Erst ${pct} % deiner Antworten richtig`]).join(". ") + ".", go: "fragen"};
  if (rate < .8) why.push(`${pct} % deiner Antworten richtig, Ziel 80 %`);
  if (cover < .8) why.push(`erst ${seenQ} von ${qs.length} Fragen gesehen`);
  if (!last) why.push("noch keine Prüfungssimulation gemacht");
  if (why.length) { const t = why.join(", "); return {cls: "mid", word: "Fast bereit", why: t[0].toUpperCase() + t.slice(1) + ".", go: !last && why.length === 1 ? "sim" : "fragen"}; }
  return {cls: "ok", word: "Bereit", why: `${pct} % deiner Antworten richtig, letzte Simulation mit ${last.pct} % bestanden. Bleib dran bis zur Prüfung.`, go: "sim"};
}
function readyCard() {

/* ---------- Ansicht: Fragen (Runden ohne Wiederholung) ---------- */
let filter = "alle", round = null;   // round = {ids, pos, results, answered}

const UNIT_DAYS = {minute: 1 / 1440, minuten: 1 / 1440, stunde: 1 / 24, stunden: 1 / 24, tag: 1, tage: 1, tagen: 1, werktage: 1, woche: 7, wochen: 7, monat: 30, monate: 30, jahr: 365, jahre: 365};

}

// Rechtsgrundlage nur als „Steht in“ zeigen, wenn es wirklich eine Vorschrift ist
const isNorm = l => /§|Art\.|\b(BGB|HGB|BBiG|UStG|KStG|EStG|GewStG|AO|AGG|HwO|VOB|JArbSchG|ArbZG|BUrlG|KSchG|MuSchG|NachwG|GmbHG|InsO|SGB|ArbSchG|AEVO|BetrVG|TzBfG|EntgFG|MiLoG|GewO|PartGG|UWG|ZPO|DSGVO|BDSG|ProdHaftG)\b/.test(l || "");
function priority(q, poolSize) {
  const s = S.stats[q.id];

  else p = 0.4 + 0.6 * (s.right / s.seen) + 0.2 * s.streak; // schwach zuerst

const ROUND_MAX = 10;   // höchstens so viele Fragen am Stück, damit eine Runde in eine Pause passt
function roundSize() {

}
function hfWeight(rate) { return rate == null ? 2 : rate < .6 ? 3 : rate < .8 ? 2 : 1; } // rot bekommt am meisten

function newRound() {
  const pool = poolFor(filter);
  const size = Math.min(roundSize(), pool.length);
  const rates = Object.fromEntries(hfStats().map(h => [h.k, h.rate]));
  // je Handlungsfeld die Fragen nach Dringlichkeit sortieren, neue und schon gesehene getrennt
  const sorted = qs => {
    const byHf = {};
    qs.forEach(q => (byHf[q.hf] = byHf[q.hf] || []).push([q.id, priority(q, pool.length)]));
    Object.values(byHf).forEach(a => a.sort((x, y) => x[1] - y[1]));
    return byHf;
  };
  const fresh = sorted(pool.filter(q => !S.stats[q.id])), seen = sorted(pool.filter(q => S.stats[q.id]));
  const ids = [], used = {};
  let lastHf = null;
  function take(byHf, until) {
    while (ids.length < until) {
      let hfs = Object.keys(byHf).filter(k => byHf[k].length);
      if (!hfs.length) break;
      // möglichst nicht zweimal dasselbe Feld hintereinander, und jedes Feld höchstens 2x pro Runde, solange andere frei sind
      const free = hfs.filter(k => k !== lastHf && (used[k] || 0) < 2);
      if (free.length) hfs = free;
      const w = hfs.map(k => hfWeight(rates[k]) / (1 + (used[k] || 0)));
      let r = Math.random() * w.reduce((a, b) => a + b, 0), k = hfs[0];
      for (let i = 0; i < hfs.length; i++) { r -= w[i]; if (r <= 0) { k = hfs[i]; break; } }
      ids.push(byHf[k].shift()[0]); used[k] = (used[k] || 0) + 1; lastHf = k;
    }

  // den Rest wie gehabt nach Dringlichkeit: schwache Wiederholungen, neue und sichere Fragen gemischt
  Object.keys(fresh).forEach(k => { seen[k] = (seen[k] || []).concat(fresh[k]).sort((x, y) => x[1] - y[1]); });
  take(seen, size);
  // neue und alte Fragen mischen, aber möglichst nicht zweimal dasselbe Handlungsfeld hintereinander
  shuffle(ids);
  const hfOf = id => Q.find(q => q.id === id).hf;
  for (let i = 1; i < ids.length; i++) {
    if (hfOf(ids[i]) !== hfOf(ids[i - 1])) continue;
    const j = ids.findIndex((id, x) => x > i && hfOf(id) !== hfOf(ids[i - 1]));
    if (j > 0) [ids[i], ids[j]] = [ids[j], ids[i]];

}

}
function stopSpeak() { spokenKey = null; if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {} }

function recordAnswer(q, ok) {   // zählt für Lernstand, Schwächen und Tagesaufgabe (auch in der Simulation)
  const s = S.stats[q.id] || (S.stats[q.id] = {seen:0, right:0, streak:0});
  s.seen++; if (ok) { s.right++; s.streak++; } else s.streak = 0;
  s.last = S.n++;

}
function answer(q, i) {

/* ---------- Prüfungssimulation ----------
   30 Fragen aus allen schriftlichen Handlungsfeldern eines Teils, gleichmäßig verteilt, 1 Minute pro Frage.
   Warum 1 Minute: Die Fragen hier sind kurz. Wer sie in einer Minute sicher beantwortet, hat in der echten
   Prüfung Luft für die langen Fallaufgaben. Der Lauf steht in S.sim, damit er ein Neuladen übersteht. */
const SIM_N = 30, SIM_MIN_PER_Q = 1;
const SIM_HF = {III: ["III-1", "III-2", "III-3"], IV: ["IV-1", "IV-2", "IV-3", "IV-4"]};   // IV-P ist mündlich, nicht Teil der schriftlichen Prüfung
let simSetup = false, simConfirm = null, simTimer = null, simWarned = 0;
const qById = id => Q.find(q => q.id === id);
const simRunning = () => !!(S.sim && !S.sim.result);
function clockText(ms) { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
function startSim(teil) {
  const hfs = SIM_HF[teil], pools = {}, ids = [];
  hfs.forEach(k => pools[k] = shuffle(Q.filter(q => q.hf === k).map(q => q.id)));
  const turn = shuffle(hfs.slice());
  for (let i = 0; ids.length < SIM_N && hfs.some(k => pools[k].length); i++) { const k = turn[i % turn.length]; if (pools[k].length) ids.push(pools[k].pop()); }
  shuffle(ids);
  const order = {}; ids.forEach(id => order[id] = answerOrder(qById(id)));
  S.sim = {teil, ids, pos: 0, picks: {}, order, start: Date.now(), end: Date.now() + ids.length * SIM_MIN_PER_Q * 60000};
  simSetup = false; simConfirm = null; simWarned = 0; save();
}
function finishSim(timeUp) {
  const sim = S.sim, byHf = {}, wrong = [];
  let right = 0;
  sim.ids.forEach(id => {
    const q = qById(id), pick = sim.picks[id], ok = pick === q.a;
    if (pick != null) recordAnswer(q, ok);                     // nicht beantwortete Fragen zählen als falsch, aber nicht im Lernstand
    const h = byHf[q.hf] || (byHf[q.hf] = {right: 0, total: 0});
    h.total++; if (ok) { h.right++; right++; } else wrong.push(id);
  });
  const pct = Math.round(right / sim.ids.length * 100);
  const weak = Object.keys(byHf).filter(k => byHf[k].right / byHf[k].total < .3);
  sim.result = {right, total: sim.ids.length, pct, byHf, wrong, weak, passed: pct >= 50 && !weak.length, timeUp: !!timeUp,
    open: sim.ids.filter(id => sim.picks[id] == null).length, used: Math.min(Date.now(), sim.end) - sim.start};
  dayLog().sim++;
  S.simHistory = (S.simHistory || []).concat({date: today(), teil: sim.teil, pct, passed: sim.result.passed}).slice(-10);   // für „Bist du bereit?“ auf Heute
  stopSpeak();
  simConfirm = null; stopSimClock(); save();
}
function stopSimClock() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }
function ensureSimClock() {
  if (simTimer || !simRunning()) return;
  simTimer = setInterval(() => {
    if (!simRunning()) return stopSimClock();
    const rest = S.sim.end - Date.now();
    if (rest <= 0) { finishSim(true); if (!$("#v-fragen").hidden) { renderSim(); window.scrollTo(0, 0); focusView(); } return; }
    const c = $("#sim-clock");
    if (c) { c.textContent = clockText(rest); c.classList.toggle("warn", rest <= 300000); }
    // Bildschirmleser: einmal bei 5 Minuten und einmal bei 1 Minute ansagen
    const live = $("#sim-live"), mark = rest <= 60000 ? 2 : rest <= 300000 ? 1 : 0;
    if (live && mark > simWarned) { simWarned = mark; live.textContent = mark === 2 ? "Noch 1 Minute." : "Noch 5 Minuten."; }
  }, 1000);
}
function simEntry() {

  v.innerHTML = `${head}

    <p class="tip"><b>So geht’s:</b> Lies den Fall, beantworte eine Aufgabe und tippe auf <b>„Antwort prüfen“</b>. Die App prüft deine Zahlen und erkennt Stichworte in deinem Text.</p>
    <div class="case-text">${c.intro.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    ${c.table ? `<div class="tbl"><table>${c.table.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table></div>` : ""}
    ${c.tasks.map((t, i) => renderTask(c, t, i)).join("")}
    <div class="sum">
      <span class="total" id="case-total">${sc.got} von ${sc.max} Punkten</span>
      <span class="small muted" id="case-note">${caseNote(sc)}</span>
    </div>
    ${confirmRestart === c.id ? `
      <div class="confirm">
        <p><b>Wirklich neu starten?</b> Alle deine Antworten zu diesem Fall werden gelöscht.${c.varies ? " Du bekommst neue Zahlen." : ""} Dein bestes Ergebnis bleibt gespeichert.</p>
        <div class="row"><button class="btn accent" id="restart-yes">Ja, neu starten</button><button class="btn ghost" id="restart-no">Abbrechen</button></div>
      </div>` : `
      <button class="btn ghost" id="restart">Fall neu starten${c.varies ? " (mit neuen Zahlen)" : ""}</button>`}
  </div>`;
  const rs = $("#restart"); if (rs) rs.addEventListener("click", () => { confirmRestart = c.id; renderFaelle(); $("#restart-yes").focus(); });
  const rn = $("#restart-no"); if (rn) rn.addEventListener("click", () => { confirmRestart = null; renderFaelle(); });
  const ry = $("#restart-yes"); if (ry) ry.addEventListener("click", () => restartCase(c));
  v.querySelectorAll("[data-case]").forEach(b => b.addEventListener("click", () => { caseId = b.dataset.case; confirmRestart = null; renderFaelle(); window.scrollTo(0, 0); }));
  v.querySelectorAll("[data-check]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.check, r = S.cases[k] || (S.cases[k] = {});
    r.nums = {}; v.querySelectorAll(`[data-num^="${k}|"]`).forEach(inp => r.nums[inp.dataset.num.split("|")[1]] = inp.value);
    const ta = document.getElementById("ans-" + k);
    if (ta) S.answers[k] = ta.value;
    r.auto = detect(k, S.answers[k]);
    r.manual = r.manual || {};
    r.done = true; dayLog().fall = 1; save();
    const y = b.getBoundingClientRect().top;          // Ergebnis dort zeigen, wo der Knopf war
    renderFaelle();
    const res = document.getElementById("res-" + k);
    if (res) window.scrollBy(0, res.getBoundingClientRect().top - Math.max(80, y));
  }));
  v.querySelectorAll("[data-tick]").forEach(cb => cb.addEventListener("change", () => {
    const [k, key] = cb.dataset.tick.split("|"), r = S.cases[k];
    r.manual = r.manual || {}; r.manual[key] = cb.checked; save();
    const t = c.tasks[+k.split("-")[1]], tot = caseScore(c);
    document.getElementById("pts-" + k).textContent = taskScore(t, r) + " von " + t.p + " Punkten";
    document.getElementById("case-total").textContent = tot.got + " von " + tot.max + " Punkten";
    document.getElementById("case-note").innerHTML = caseNote(tot);
  }));
  v.querySelectorAll("[data-sign]").forEach(b => b.addEventListener("click", () => {
    const inp = document.getElementById(b.dataset.sign), val = inp.value.trim();
    inp.value = /^[-−]/.test(val) ? val.replace(/^[-−]\s*/, "") : "-" + val;
    inp.dispatchEvent(new Event("input"));
    inp.focus();
  }));
  v.querySelectorAll("[data-num]").forEach(inp => inp.addEventListener("input", () => {   // Zahlen sofort merken, nicht erst beim Prüfen
    const [k, ni] = inp.dataset.num.split("|"), r = S.cases[k] || (S.cases[k] = {});
    (r.nums = r.nums || {})[ni] = inp.value; save();
  }));
  v.querySelectorAll("textarea").forEach(t => t.addEventListener("input", () => { S.answers[t.dataset.k] = t.value; save(); }));
}
let confirmRestart = null;

/* ---------- Fit fürs Fachgespräch (Teil IV, praktische Prüfung) ----------
   Zwei Teile: eine Unterweisung Schritt für Schritt planen (mit Spickzettel) und typische Prüferfragen üben.
   Inhalte sind Entwürfe und stehen zur Prüfung in Lektorat.md. */
const COACH_Q = [
 {q: "Warum haben Sie für diese Unterweisung die Vier-Stufen-Methode gewählt?", a: ["Sie passt gut zu praktischen Handgriffen: Der Azubi sieht zu, macht nach und übt.", "Ich sehe sofort, ob er es kann, und kann gleich korrigieren.", "Für reines Wissen würde ich eher ein Lehrgespräch wählen, für selbstständiges Arbeiten die Leittextmethode."]},
 {q: "Wie überprüfen Sie, ob der Azubi das Lernziel erreicht hat?", a: ["Er führt die Tätigkeit allein aus, und ich vergleiche das Ergebnis mit dem Lernziel (Maß, Sauberkeit, Zeit).", "Ich lasse ihn die Arbeitsschritte erklären und frage nach dem Warum.", "Danach gebe ich ihm eine Rückmeldung und lasse ihn bei Bedarf noch einmal üben."]},
 {q: "Was ist ein Lernziel, und wie formulieren Sie es?", a: ["Es beschreibt, was der Azubi danach kann.", "Mit einem Verb, das man beobachten kann (z. B. „anschließen“, „verspachteln“) statt „verstehen“ oder „kennenlernen“.", "Dazu die Bedingungen (Werkzeug, Hilfsmittel) und woran man den Erfolg misst (z. B. Toleranz, Zeit)."]},
 {q: "Welche Lernzielbereiche gibt es?", a: ["Kognitiv: Wissen und Denken, z. B. Arbeitsschritte erklären.", "Psychomotorisch: Handgriffe und Fertigkeiten.", "Affektiv: Einstellungen, z. B. Sorgfalt oder Sicherheitsbewusstsein.", "Eine gute Unterweisung spricht mehrere Bereiche an."]},
 {q: "Wie passt Ihre Unterweisung in die Ausbildung?", a: ["Der Inhalt steht im Ausbildungsrahmenplan der Ausbildungsordnung (BBiG § 5).", "Daraus wird der betriebliche Ausbildungsplan erstellt.", "Ich nenne das Ausbildungsjahr und, wenn möglich, das passende Lernfeld der Berufsschule."]},
 {q: "Wie motivieren Sie den Azubi?", a: ["Ich zeige, wofür er das in der Praxis braucht.", "Ich knüpfe an das an, was er schon kann.", "Er darf selbst machen, ich lobe Fortschritte und übertrage Verantwortung."]},
 {q: "Was tun Sie, wenn der Azubi einen Fehler macht?", a: ["Ruhig bleiben und ihn nicht vor anderen bloßstellen.", "Ihn den Fehler möglichst selbst finden lassen und die Ursache klären.", "Den richtigen Ablauf noch einmal zeigen und ihn wiederholen lassen. Fehler sind eine Lerngelegenheit."]},
 {q: "Wie berücksichtigen Sie die Arbeitssicherheit?", a: ["Gefahren und Schutzausrüstung erkläre ich gleich zu Beginn.", "Ich halte mich an die Unfallverhütungsvorschriften der Berufsgenossenschaft.", "Jugendliche muss ich vor Beginn der Beschäftigung und mindestens halbjährlich unterweisen (JArbSchG § 29)."]},
 {q: "Was machen Sie, wenn der Azubi es nach der Unterweisung noch nicht kann?", a: ["Ursache klären: zu schnell, zu viel auf einmal, fehlt Vorwissen?", "In kleinere Schritte teilen und mehr Übungszeit geben.", "Eine andere Methode oder andere Hilfsmittel nutzen, einen Gesellen als Paten einsetzen."]},
 {q: "Wie gehen Sie mit unterschiedlich starken Azubis um?", a: ["Vorwissen vorher erfragen.", "Tempo und Schwierigkeit anpassen.", "Stärkere bekommen Zusatzaufgaben oder erklären anderen, Schwächere bekommen mehr Übung und Hilfen (z. B. Assistierte Ausbildung)."]},
 {q: "Welche Hilfsmittel und Medien haben Sie eingesetzt, und warum?", a: ["Originalwerkzeug und -material, damit es wie im Alltag ist.", "Ein fertiges Muster zeigt das Ziel, eine Skizze oder ein Arbeitsblatt hilft beim Merken.", "So spreche ich mehrere Sinne an."]},
 {q: "Wie geben Sie dem Azubi Rückmeldung?", a: ["Zeitnah und konkret.", "Erst das Gute, dann was besser werden soll.", "Sachlich zur Arbeit, nicht zur Person, mit Ich-Botschaften. Gemeinsam die nächsten Schritte vereinbaren."]}
];
const PLAN_FIELDS = [
 ["thema", "Was zeigst du?", "z. B. Eine Steckdose fachgerecht anschließen", "text"],
 ["azubi", "Für wen?", "z. B. Azubi im 1. Ausbildungsjahr, 16 Jahre, kennt schon die Werkzeuge", "text"],
 ["ziel", "Lernziel: Was kann der Azubi danach, und woran erkennst du das?", "z. B. Der Azubi schließt eine Steckdose ohne Hilfe an. Alle Adern sitzen fest, die Prüfung mit dem Messgerät ist in Ordnung.", "area"],
 ["s1", "Stufe 1: Vorbereiten", "Ziel nennen, Vorwissen fragen, Material bereitlegen, Sicherheit erklären", "area"],
 ["s2", "Stufe 2: Vormachen und erklären", "Schritt für Schritt zeigen, wichtige Stellen betonen (Was? Wie? Warum?)", "area"],
 ["s3", "Stufe 3: Nachmachen und erklären lassen", "Azubi macht es selbst und erklärt dabei, du korrigierst und lobst", "area"],
 ["s4", "Stufe 4: Üben und abschließen", "Azubi übt allein, du kontrollierst das Ergebnis und gibst Rückmeldung", "area"],
 ["sicher", "Sicherheit: Welche Gefahren und welche Schutzausrüstung sprichst du an?", "z. B. Spannungsfreiheit prüfen, gegen Wiedereinschalten sichern", "text"],
 ["material", "Material und Hilfsmittel", "z. B. Steckdose, Kabel, Abisolierzange, Prüfgerät, fertiges Muster", "text"],
 ["zeit", "Geplante Zeit in Minuten", "z. B. 15", "num"]
];
let coachTab = "plan", coachPos = 0, coachShow = false, coachCheat = false;
S.coach = S.coach || {};
function planChecks(p) {
  const f = k => (p[k] || "").trim(), z = parseNum(f("zeit"));
  return [
    [!!f("thema"), "Thema steht fest"],
    [f("ziel").length >= 20 && !/\b(verstehen|versteht|kennenlernen|kennt|wissen|weiß)\b/i.test(f("ziel")), "Lernziel mit beobachtbarem Verb (nicht „verstehen“ oder „kennen“)"],
    [["s1", "s2", "s3", "s4"].every(k => f(k)), "Alle vier Stufen geplant"],
    [!!f("sicher"), "Sicherheit eingeplant"],
    [!!f("material"), "Material und Hilfsmittel aufgeschrieben"],
    [z > 0 && z <= 15, "Zeit höchstens 15 Minuten"]
  ];
}
function renderCoach() {
  const v = $("#v-faelle"), p = S.coach.plan || (S.coach.plan = {}), rated = S.coach.q || (S.coach.q = {});
  const tabs = `<div class="seg" role="group" aria-label="Fachgespräch">
      <button data-ct="plan" aria-pressed="${coachTab === "plan"}">Unterweisung planen</button>
      <button data-ct="fragen" aria-pressed="${coachTab === "fragen"}">Prüferfragen üben</button></div>`;
  let body;
  if (coachTab === "plan" && coachCheat) {
    body = `<div class="cheat" id="cheat">
      <h3>${esc(p.thema || "Meine Unterweisung")}</h3>
      ${PLAN_FIELDS.filter(([k]) => k !== "thema" && (p[k] || "").trim()).map(([k, l]) => `<p><b>${k === "zeit" ? "Zeit" : esc(l.split(":")[0].replace("?", ""))}:</b> ${esc(p[k])}${k === "zeit" ? " Minuten" : ""}</p>`).join("")}
    </div>
    <p class="small muted">Stichwortnotizen, die du selbst geschrieben hast, darfst du in der Regel mitnehmen. Frag sicherheitshalber bei deiner Handwerkskammer nach.</p>
    <div class="row"><button class="btn accent" id="cheat-print" style="flex:1 1 160px">Drucken</button><button class="btn ghost" id="cheat-back" style="flex:1 1 160px">Zurück zum Plan</button></div>`;
  } else if (coachTab === "plan") {
    const done = planChecks(p).filter(c => c[0]).length;
    body = `<p>Plane deine Unterweisung Schritt für Schritt. Alles wird sofort gespeichert. Am Ende bekommst du einen Spickzettel.</p>
    ${PLAN_FIELDS.map(([k, l, ph, t]) => `<div style="display:flex;flex-direction:column;gap:6px">
      <label for="pl-${k}">${esc(l)}</label>
      ${t === "area" ? `<textarea id="pl-${k}" data-plan="${k}" placeholder="${esc(ph)}">${esc(p[k] || "")}</textarea>`
        : `<input type="text" id="pl-${k}" data-plan="${k}" ${t === "num" ? 'inputmode="numeric"' : ""} placeholder="${esc(ph)}" value="${esc(p[k] || "")}">`}</div>`).join("")}
    <fieldset class="checks"><legend>Hast du an alles gedacht? <span id="plan-count">${done} von 6</span></legend><div id="plan-check">${planCheckHtml(p)}</div></fieldset>
    <p class="small muted">In der praktischen Prüfung (Teil IV) dauert die Präsentation oder Durchführung laut Ausbilder-Eignungsverordnung höchstens 15 Minuten, danach folgt das Fachgespräch.</p>
    <button class="btn accent" id="cheat-open">Spickzettel ansehen</button>`;
  } else {
    const i = Math.min(coachPos, COACH_Q.length - 1), cq = COACH_Q[i], r = rated[i];
    const good = Object.values(rated).filter(x => x === "gut").length;
    body = `<div class="row" style="justify-content:space-between"><b>Frage ${i + 1} von ${COACH_Q.length}</b><span class="small muted">${good} sicher beantwortet</span></div>
    <div class="qtools">${voiceTools()}</div>
    <p class="small muted">So fragt dich der Prüfer nach deiner Unterweisung. Überleg dir eine Antwort oder sag sie laut. Dann deck die Musterantwort auf.</p>
    <div class="qtext" id="qtext" tabindex="-1">${esc(cq.q)}</div>
    ${coachShow ? `<div class="explain" role="status"><b>Musterantwort (Stichpunkte, Entwurf):</b><ul class="howto">${cq.a.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <p><b>Wie gut konntest du das?</b></p>
      <div class="choice">${[["gut", "Konnte ich"], ["teils", "Teilweise"], ["nein", "Noch nicht"]].map(([k, t]) => `<button class="btn ${r === k ? "accent" : "ghost"}" data-rate="${k}">${t}</button>`).join("")}</div>`
      : `<button class="btn accent" id="coach-show">Musterantwort zeigen</button>`}
    <div class="row"><button class="btn ghost" id="coach-prev" ${i ? "" : "disabled"} style="flex:1">Zurück</button><button class="btn ghost" id="coach-next" style="flex:1">${i + 1 < COACH_Q.length ? "Überspringen" : "Von vorn"}</button></div>`;
  }
  v.innerHTML = `<h2 class="sr view-h" tabindex="-1">Fälle</h2>
  <div class="card">
    ${caseSeg()}
    <h2>Fit fürs Fachgespräch</h2>
    <p class="small muted">Für die praktische Prüfung in Teil IV. Entwurf, noch nicht vom Dozenten geprüft.</p>
    ${tabs}
    ${body}
  </div>`;
  v.querySelectorAll("[data-case]").forEach(b => b.addEventListener("click", () => { caseId = b.dataset.case; confirmRestart = null; stopSpeak(); renderFaelle(); window.scrollTo(0, 0); }));
  v.querySelectorAll("[data-ct]").forEach(b => b.addEventListener("click", () => { coachTab = b.dataset.ct; coachShow = false; coachCheat = false; stopSpeak(); renderCoach(); }));
  v.querySelectorAll("[data-plan]").forEach(inp => inp.addEventListener("input", () => {
    p[inp.dataset.plan] = inp.value; save();
    $("#plan-check").innerHTML = planCheckHtml(p);
    $("#plan-count").textContent = planChecks(p).filter(c => c[0]).length + " von 6";
  }));
  const bind = (id, f) => { const b = $(id); if (b) b.addEventListener("click", f); };
  bind("#cheat-open", () => { coachCheat = true; dayLog().fall = 1; save(); renderCoach(); window.scrollTo(0, 0); });
  bind("#cheat-back", () => { coachCheat = false; renderCoach(); });
  bind("#cheat-print", () => { try { window.print(); } catch (e) {} });
  const go = n => { coachPos = (n + COACH_Q.length) % COACH_Q.length; coachShow = false; renderCoach(); window.scrollTo(0, 0); const t = $("#qtext"); if (t) t.focus({preventScroll: true}); };
  bind("#coach-show", () => { coachShow = true; renderCoach(); });
  bind("#coach-prev", () => go(coachPos - 1));
  bind("#coach-next", () => go(coachPos + 1));
  v.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => { rated[coachPos] = b.dataset.rate; dayLog().fall = 1; save(); go(coachPos + 1); }));
  if (coachTab === "fragen") {
    bindVoice(v, renderCoach);
    const cq = COACH_Q[coachPos];
    if (coachShow) speakOnce("coach:" + coachPos + ":a", () => ["Musterantwort.", ...cq.a]);
    else speakOnce("coach:" + coachPos + ":q", () => [cq.q]);
  }
}
const planCheckHtml = p => planChecks(p).map(([ok, t]) => `<div class="small ${ok ? "ok-t" : "muted"}">${ok ? "✓" : "○"} ${esc(t)}</div>`).join("");
function restartCase(c) {
  const sc = caseScore(c);
  if (sc.done) { S.best = S.best || {}; const pct = Math.round(sc.got / c.tasks.reduce((n, t) => n + t.p, 0) * 100); if (S.best[c.id] == null || pct > S.best[c.id]) S.best[c.id] = pct; }
  c.tasks.forEach((t, i) => { delete S.cases[c.id + "-" + i]; delete S.answers[c.id + "-" + i]; });
  if (c.varies) S.seeds[c.id] = 1 + Math.floor(Math.random() * 2147483646);
  confirmRestart = null; save(); CASES = buildCases(); renderFaelle(); window.scrollTo(0, 0);
}
function caseNote(sc) {
  return `${sc.done} von ${sc.total} Aufgaben geprüft${sc.done ? " · " + (sc.got >= sc.max / 2 ? '<b class="ok-t">bestanden</b>' : '<b class="no-t">noch nicht bestanden</b>') : ""}. Bestanden ab der Hälfte der Punkte.`;
}
function fmtAnswer(n) {   // richtige Lösung mit passenden Nachkommastellen und Einheit
  if (n.u === "€") return eur(n.a);
  const d = Math.min(2, (String(n.a).split(".")[1] || "").length);
  return num(n.a, d) + " " + n.u;
}
function renderTask(c, t, i) {
  const k = c.id + "-" + i, r = S.cases[k], done = r && r.done;
  const hasText = (t.groups || []).length > 0;
  const nums = (t.nums || []).map((n, ni) => {
    const id = `n-${k}-${ni}`, val = ((r || {}).nums || {})[ni] ?? "";   // auch ungeprüfte Zahlen bleiben stehen
    const ok = numOk(n, val);
    return `<div class="numrow ${done ? (ok ? "right" : "wrong") : ""}">
      <label for="${id}">${esc(n.l)}</label>
      <div class="answer">
        ${n.u === "€" ? `<button type="button" class="sign" data-sign="${id}" aria-label="Minus davor setzen oder entfernen">±</button>` : ""}
        <input type="text" inputmode="decimal" id="${id}" data-num="${k}|${ni}" value="${esc(val)}" placeholder="Ergebnis" autocomplete="off">
        <span class="unit">${n.u}</span></div>
      ${done ? `<div class="small ${ok ? "ok-t" : "no-t"}">${ok ? "✓ Richtig" : (String(val).trim() ? "✗ Nicht ganz. " : "Nichts eingetragen. ") + "Richtig wäre " + fmtAnswer(n)}</div>` : ""}
    </div>`; }).join("");
  const write = hasText ? `<label class="small" for="ans-${k}"><b>${t.nums ? "Und jetzt in Worten:" : "Deine Antwort"}</b> Stichpunkte reichen.</label>
    <textarea id="ans-${k}" data-k="${k}" placeholder="Schreib hier deine Antwort.">${esc(S.answers[k] || "")}</textarea>` : "";

  let result = "";
  if (done) {
    const score = taskScore(t, r), full = score === t.p;
    const found = hasText ? Object.keys(r.auto || {}).length : 0;
    const groups = hasText ? (t.groups || []).map((g, gi) => `
      <fieldset class="checks"><legend>${esc(g.g)}</legend>
        ${g.items.map((it, ii) => { const key = gi + "-" + ii, auto = (r.auto || {})[key];
          return `<label class="check ${auto ? "auto" : ""}"><input type="checkbox" data-tick="${k}|${key}" ${isTicked(r, key) ? "checked" : ""}><span>${esc(it[0])}${auto ? ' <em class="found">erkannt</em>' : ""}</span><span class="p">${it[1]} P.</span></label>`; }).join("")}
      </fieldset>`).join("") : "";
    result = `
      <div id="res-${k}" class="result ${full ? "full" : ""}">
        <b id="pts-${k}" class="total">${score} von ${t.p} Punkten</b>
        <span class="small">${full ? "Alles richtig, stark!" : hasText
          ? (found ? `In deinem Text wurde${found === 1 ? " eine richtige Antwort" : "n " + found + " richtige Antworten"} erkannt (grün markiert). Hast du noch etwas anderes aus der Liste geschrieben? Dann hake es an.` : "In deinem Text wurde nichts aus der Liste erkannt. Hake an, was du trotzdem genannt hast.")
          : "Korrigiere die roten Felder und prüfe nochmal."}</span>
      </div>
      ${hasText && !full ? groups : ""}
      ${t.scheme ? `<details class="solution"><summary><b>So wird gerechnet</b></summary>${schemeHtml(t)}</details>`
        : t.way ? `<details class="solution"><summary><b>${(t.nums || []).some(n => n.u === "€" || n.u === "%") ? "So wird gerechnet" : "Erklärung"}</b></summary>${t.way.map(x => `<p>${esc(x)}</p>`).join("")}</details>` : ""}`;
  }
  return `
    <div class="task" id="task-${k}">
      <div class="task-h"><span>Aufgabe ${i + 1}</span><span class="pts">${t.p} Punkte</span></div>
      <p>${esc(t.t)}</p>
      ${nums}${write}
      ${result}
      <button class="btn ${done ? "ghost" : "accent"}" data-check="${k}">${done ? "Nochmal prüfen" : "Antwort prüfen"}</button>
    </div>`;
}

/* ---------- Navigation ---------- */
const RENDER = {heute: renderHeute, fragen: renderFragen, rechnen: renderRechnen, faelle: renderFaelle};
function show(name, focusHead) {
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-" + name);
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.v === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  stopSpeak();
  RENDER[name]();
  window.scrollTo(0, 0);
  // nach dem Reiterwechsel springt der Fokus auf den neuen Bereich (für Bildschirmleser und Tastatur)
  if (focusHead) { const h = $("#v-" + name + " .view-h"); if (h) h.focus({preventScroll: true}); }
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.v, true)));
const start = (location.hash || "").slice(1);
show(RENDER[start] ? start : "heute");
